<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>محمد أولاد بوشتة</title>
    <meta name="description" content="محمد أولاد بوشتة: ألعاب وتطبيقات عربية على Google Play، وقناة ظلال التاريخ على يوتيوب." />
    <link rel="alternate" hreflang="ar" href="https://javamohammed.github.io/?lang=ar" />
    <link rel="alternate" hreflang="en" href="https://javamohammed.github.io/?lang=en" />
    <link rel="alternate" hreflang="fr" href="https://javamohammed.github.io/?lang=fr" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      :root {
        --plaster: #dce2da;   /* خلفية تادلاكت */
        --plaster-2: #cfd7cd;
        --ink: #1f2b27;       /* حبر أخضر داكن */
        --moss: #4f6b5e;
        --saffron: #e3a43a;   /* ضوء القنديل */
        --paper: #f6f7f3;
        --display: "Reem Kufi", "IBM Plex Sans Arabic", sans-serif;
        --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--plaster);
        color: var(--ink);
        font-family: var(--body);
        font-size: 18px;
        line-height: 1.75;
      }
      a { color: var(--ink); text-underline-offset: 4px; text-decoration-thickness: 1px; }
      a:hover { text-decoration-thickness: 2px; }
      :focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }
      .wrap { max-width: 1080px; margin-inline: auto; padding-inline: 28px; }

      .top { display: flex; justify-content: space-between; align-items: center; padding-block: 22px; }
      .mark { font-family: var(--display); font-weight: 700; font-size: 20px; text-decoration: none; }
      .langs { display: flex; gap: 4px; }
      .langs button {
        font: 500 15px var(--body); color: var(--moss);
        background: none; border: 0; padding: 6px 10px; cursor: pointer; border-radius: 4px;
      }
      .langs button[aria-pressed="true"] { color: var(--paper); background: var(--ink); }

      .hero { padding-block: 9vh 72px; }
      .hero h1 {
        font-family: var(--display); font-weight: 700;
        font-size: clamp(52px, 10vw, 128px); line-height: 1.05;
        margin: 0 0 32px; letter-spacing: -0.01em;
      }
      :lang(en) .hero h1, :lang(fr) .hero h1 { letter-spacing: -0.03em; }
      :lang(en) h1, :lang(en) h2, :lang(en) h3, :lang(en) dt, :lang(fr) h1, :lang(fr) h2, :lang(fr) h3, :lang(fr) dt { word-spacing: 0.12em; }
      .hero p { margin: 0; max-width: 34ch; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.6; }
      .hero .since { margin-top: 14px; font-size: 17px; color: var(--moss); }

      h2 { font-family: var(--display); font-weight: 500; font-size: 30px; margin: 0 0 28px; color: var(--moss); }
      section { padding-block: 56px; }

      .apps { list-style: none; margin: 0; padding: 0; display: grid; gap: 44px; }
      .app { display: grid; grid-template-columns: 96px 1fr; gap: 28px; align-items: start; }
      .app img { width: 96px; height: 96px; border-radius: 22px; display: block; box-shadow: 0 2px 0 var(--plaster-2); }
      .app h3 { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.25; margin: 0 0 6px; }
      .app p { margin: 0; max-width: 60ch; }
      .app .acts { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; font-size: 16px; }
      .play {
        display: inline-block; padding: 7px 16px; border-radius: 6px;
        background: var(--ink); color: var(--paper); text-decoration: none; font-weight: 600;
      }
      .play:hover { background: var(--moss); }

      .screen {
        position: relative; overflow: hidden;
        border: 14px solid var(--ink); border-radius: 4px;
        background: #b8792a;
        min-height: 420px;
        display: flex; align-items: flex-start;
      }
      .screen::before {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(60% 75% at 50% 42%, #f7d58a 0%, #eeb24f 38%, #c47f2b 75%, #8a521c 100%);
        animation: flicker 5s ease-in-out infinite;
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        42% { opacity: 0.93; }
        47% { opacity: 1; }
        71% { opacity: 0.96; }
      }
      .screen svg { display: block; position: absolute; inset-inline: 0; bottom: -2px; width: 100%; height: auto; }
      .screen .txt { position: relative; padding: 44px 48px 150px; max-width: 640px; }
      .screen h3 { font-family: var(--display); font-weight: 700; font-size: clamp(38px, 6vw, 64px); line-height: 1.1; margin: 0 0 14px; }
      .screen p { margin: 0 0 22px; font-size: 19px; }

      .next { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px 48px; margin: 0; }
      .next dt { font-family: var(--display); font-weight: 700; font-size: 22px; }
      .next dd { margin: 2px 0 0; color: var(--moss); }

      footer { background: var(--ink); color: var(--paper); padding-block: 56px 40px; margin-top: 40px; }
      footer h2 { color: var(--plaster-2); }
      footer #mail { color: var(--paper); font-family: var(--display); font-size: clamp(22px, 4vw, 36px); }
      .social { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 28px; }
      footer .social a { font-family: var(--body); font-size: 18px; color: var(--plaster-2); }
      footer .social a:hover { color: var(--paper); }
      footer small { display: block; margin-top: 36px; color: #9fb0a7; font-size: 14px; }

      @media (max-width: 640px) {
        .wrap { padding-inline: 20px; }
        .mark { display: none; }
        .top { justify-content: flex-end; }
        .app { grid-template-columns: 64px 1fr; gap: 18px; }
        .app img { width: 64px; height: 64px; border-radius: 15px; }
        .app h3 { font-size: 24px; }
        .screen { border-width: 10px; min-height: 0; }
        .screen .txt { padding: 28px 24px 110px; }
      }
      @media (prefers-reduced-motion: reduce) { .screen::before { animation: none; } }
    </style>
  </head>
  <body>
    <header class="wrap top">
      <a class="mark" href="./" id="mark"></a>
      <nav class="langs" aria-label="Language">
        <button type="button" data-lang="ar" lang="ar">العربية</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="fr" lang="fr">Français</button>
      </nav>
    </header>

    <main>
      <div class="wrap hero">
        <h1 id="name"></h1>
        <p id="intro"></p>
        <p class="since" id="since"></p>
      </div>

      <section class="wrap" id="apps">
        <h2 data-t="apps"></h2>
        <ul class="apps" id="appsList"></ul>
      </section>

      <section class="wrap" id="channels"></section>

      <section class="wrap" id="next">
        <h2 data-t="next"></h2>
        <dl class="next" id="nextList"></dl>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <h2 data-t="contact"></h2>
        <a id="mail"></a>
        <ul class="social" id="social"></ul>
        <small id="copy"></small>
      </div>
    </footer>

    <script src="data.js"></script>
    <script>
      const UI = {
        ar: { apps: "التطبيقات", channel: "على يوتيوب", next: "قيد التحضير", contact: "للتواصل", play: "حمّل من Google Play", privacy: "سياسة الخصوصية", terms: "شروط الاستخدام", watch: "شاهد القناة على يوتيوب" },
        en: { apps: "Apps", channel: "On YouTube", next: "In the works", contact: "Get in touch", play: "Get it on Google Play", privacy: "Privacy policy (Arabic)", terms: "Terms of use (Arabic)", watch: "Watch the channel on YouTube" },
        fr: { apps: "Applications", channel: "Sur YouTube", next: "En préparation", contact: "Me contacter", play: "Disponible sur Google Play", privacy: "Confidentialité (en arabe)", terms: "Conditions d'utilisation (en arabe)", watch: "Voir la chaîne sur YouTube" },
      };
      const LANGS = ["ar", "en", "fr"];
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

      const SKYLINE = `<svg viewBox="0 0 1000 170" preserveAspectRatio="xMidYMax slice" aria-hidden="true" fill="#1f2b27">
        <path d="M0 170V138h90v-30q30-46 60 0v30h70V44h10V26l6-12 6 12v18h10v94h80v-46q60-78 120 0v46h60V70h14V56h6V40l5-10 5 10v16h6v14h14v68h90v-24q32-34 64 0v24h80V98h18V84h20v14h18v40h170v32z"/>
        <path d="M905 138c-2-34 1-60 6-84-16 4-30 14-40 26 8-16 22-28 38-34-14-4-30-2-42 6 12-12 30-16 46-12-4-10-14-18-26-22 16 0 28 8 34 20 6-10 18-16 30-16-12 6-20 16-22 28 14-4 30 0 40 10-14-4-28-2-38 6 12 2 24 10 30 22-12-8-26-12-40-10-4 22-6 46-4 60z"/>
      </svg>`;

      function pick() {
        const q = new URLSearchParams(location.search).get("lang");
        if (LANGS.includes(q)) return q;
        try { const s = localStorage.getItem("lang"); if (LANGS.includes(s)) return s; } catch (e) {}
        const n = (navigator.language || "").slice(0, 2);
        return n === "fr" ? "fr" : n === "en" ? "en" : "ar";
      }

      function render(lang) {
        const t = UI[lang];
        const L = (o) => (o && (o[lang] || o.ar)) || "";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.title = L(SITE.name);
        document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
        document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t[el.dataset.t]));

        $("mark").textContent = L(SITE.name);
        $("name").textContent = L(SITE.name);
        $("intro").textContent = L(SITE.intro);
        $("since").textContent = L(SITE.since);
        $("mail").textContent = SITE.email;
        $("mail").href = "mailto:" + SITE.email;
        $("social").innerHTML = (typeof SOCIAL !== "undefined" ? SOCIAL : []).map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a></li>`).join("");
        $("copy").textContent = "© " + new Date().getFullYear() + " " + L(SITE.name);

        $("appsList").innerHTML = APPS.map((a) => `
          <li class="app">
            <img src="${esc(a.icon)}" alt="" width="96" height="96" loading="lazy" />
            <div>
              <h3>${esc(L(a.name))}</h3>
              <p>${esc(L(a.desc))}</p>
              <div class="acts">
                ${a.play ? `<a class="play" href="${esc(a.play)}" target="_blank" rel="noopener">${t.play}</a>` : ""}
                ${a.privacy ? `<a href="${esc(a.privacy)}">${t.privacy}</a>` : ""}
                ${a.terms ? `<a href="${esc(a.terms)}">${t.terms}</a>` : ""}
              </div>
            </div>
          </li>`).join("");

        $("channels").innerHTML = `<h2>${t.channel}</h2>` + CHANNELS.map((c) => `
          <div class="screen">
            <div class="txt">
              <h3>${esc(L(c.name))}</h3>
              <p>${esc(L(c.desc))}</p>
              ${c.url ? `<a class="play" href="${esc(c.url)}" target="_blank" rel="noopener">${t.watch}</a>` : ""}
            </div>
            ${SKYLINE}
          </div>`).join('<div style="height:28px"></div>');

        $("nextList").innerHTML = NEXT.map((n) => `<div><dt>${esc(L(n.name))}</dt><dd>${esc(L(n.desc))}</dd></div>`).join("");
        if (!NEXT.length) $("next").hidden = true;
      }

      document.querySelectorAll(".langs button").forEach((b) =>
        b.addEventListener("click", () => {
          try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
          const u = new URL(location); u.searchParams.set("lang", b.dataset.lang); history.replaceState(null, "", u);
          render(b.dataset.lang);
        })
      );
      render(pick());
    </script>
  </body>
</html>
